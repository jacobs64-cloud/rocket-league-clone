<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Rocket Arena (Three.js + Cannon-es)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #070913; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 24px;
    }
    .scoreboard {
      align-self: center; display: flex; align-items: center; gap: 20px;
      background: rgba(10, 14, 28, 0.8); border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 28px; border-radius: 12px; backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .score-blue { color: #00d2ff; font-size: 2rem; font-weight: 800; text-shadow: 0 0 12px rgba(0,210,255,0.6); }
    .score-orange { color: #ff7b00; font-size: 2rem; font-weight: 800; text-shadow: 0 0 12px rgba(255,123,0,0.6); }
    .divider { font-size: 1.2rem; opacity: 0.5; font-weight: 700; }
    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
    .controls {
      background: rgba(10, 14, 28, 0.75); border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 18px; border-radius: 10px; font-size: 0.85rem; line-height: 1.6;
    }
    .controls span { color: #00d2ff; font-weight: 700; }
    .boost-container {
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(10, 14, 28, 0.85); border: 3px solid rgba(255, 165, 0, 0.4);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 0 25px rgba(255, 140, 0, 0.25);
    }
    #boost-val { font-size: 2.2rem; font-weight: 900; color: #ffae00; }
    .boost-label { font-size: 0.75rem; letter-spacing: 2px; opacity: 0.7; }
    #goal-banner {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      font-size: 4.5rem; font-weight: 900; letter-spacing: 6px; opacity: 0;
      transition: all 0.25s ease-out; text-shadow: 0 0 30px currentColor;
    }
    #goal-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com",
        "three/addons/": "https://unpkg.com",
        "cannon-es": "https://unpkg.com"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="scoreboard">
      <div class="score-blue" id="score-blue">0</div>
      <div class="divider">VS</div>
      <div class="score-orange" id="score-orange">0</div>
    </div>
    <div id="goal-banner">GOAL!</div>
    <div class="bottom-bar">
      <div class="controls">
        <div><span>W / S</span> — Accelerate / Reverse</div>
        <div><span>A / D</span> — Steer & Air Roll</div>
        <div><span>SHIFT</span> — Rocket Boost</div>
        <div><span>SPACE</span> — Jump / Double Jump</div>
        <div><span>C</span> — Toggle Ball Cam / Car Cam</div>
        <div><span>R</span> — Reset Kickoff</div>
      </div>
      <div class="boost-container">
        <div id="boost-val">100</div>
        <div class="boost-label">BOOST</div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import * as CANNON from 'cannon-es';

    // --- 1. RENDERER & POST-PROCESSING (BLOOM GRAPHICS) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060812);
    scene.fog = new THREE.FogExp2(0x060812, 0.0045);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.4, 0.85);
    composer.addPass(bloomPass);

    // --- 2. LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0x88bbff, 0x1a2238, 0.8);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(40, 80, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 200;
    const d = 75;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- 3. CANNON-ES PHYSICS WORLD ---
    const world = new CANNON.World();
    world.gravity.set(0, -18, 0); // Snappy arcade gravity
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.defaultContactMaterial.friction = 0.2;

    const groundMat = new CANNON.Material('ground');
    const ballMat = new CANNON.Material('ball');
    const wallMat = new CANNON.Material('wall');

    world.addContactMaterial(new CANNON.ContactMaterial(groundMat, ballMat, { friction: 0.3, restitution: 0.78 }));
    world.addContactMaterial(new CANNON.ContactMaterial(wallMat, ballMat, { friction: 0.1, restitution: 0.85 }));

    // --- 4. ARENA CONSTRUCTION ---
    const ARENA_W = 80;
    const ARENA_L = 120;
    const WALL_H = 26;
    const GOAL_W = 24;
    const GOAL_H = 10;
    const GOAL_D = 12;

    // Procedural Turf Grid Texture
    function createTurfTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0e1726';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#182842';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 512, 512);
      ctx.fillStyle = '#121e31';
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillRect(256, 256, 256, 256);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 24);
      return tex;
    }

    // Ground
    const groundGeo = new THREE.PlaneGeometry(ARENA_W, ARENA_L);
    const groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
      map: createTurfTexture(), roughness: 0.65, metalness: 0.15
    }));
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // Center pitch markings
    const ringGeo = new THREE.RingGeometry(11.5, 12.2, 64);
    const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x00d2ff, side: THREE.DoubleSide }));
    ringMesh.rotation.x = -Math.PI / 2;
    ringMesh.position.y = 0.03;
    scene.add(ringMesh);

    const midLine = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_W, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 }));
    midLine.rotation.x = -Math.PI / 2;
    midLine.position.y = 0.02;
    scene.add(midLine);

    const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // Helper for Arena Walls & Curved Ramps
    function addStaticBox(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0, color = 0x162238, emissive = 0x000000, opacity = 0.35) {
      const body = new CANNON.Body({ mass: 0, material: wallMat });
      body.addShape(new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)));
      body.position.set(x, y, z);
      body.quaternion.setFromEuler(rx, ry, rz);
      world.addBody(body);

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
          color, emissive, emissiveIntensity: 1.5,
          transparent: opacity < 1, opacity, roughness: 0.3, metalness: 0.7
        })
      );
      mesh.position.copy(body.position);
      mesh.quaternion.copy(body.quaternion);
      scene.add(mesh);
      return mesh;
    }

    // Side walls
    addStaticBox(2, WALL_H, ARENA_L, -ARENA_W / 2 - 1, WALL_H / 2, 0);
    addStaticBox(2, WALL_H, ARENA_L, ARENA_W / 2 + 1, WALL_H / 2, 0);
    // Ceiling
    addStaticBox(ARENA_W, 2, ARENA_L, 0, WALL_H + 1, 0, 0, 0, 0, 0x0a101d, 0x000000, 0.15);
    // Angled Corner / Side Ramps (prevents ball getting stuck)
    addStaticBox(4, 1, ARENA_L, -ARENA_W / 2 + 1, 1, 0, 0, 0, -Math.PI / 4, 0x00d2ff, 0x004466, 0.8);
    addStaticBox(4, 1, ARENA_L, ARENA_W / 2 - 1, 1, 0, 0, 0, Math.PI / 4, 0xff7b00, 0x552200, 0.8);

    // Back Walls around Goals (Orange = -Z, Blue = +Z)
    const sideBackW = (ARENA_W - GOAL_W) / 2;
    [-1, 1].forEach(dir => {
      const zPos = dir * (ARENA_L / 2 + 1);
      const glow = dir === 1 ? 0x0066aa : 0xaa4400;
      addStaticBox(sideBackW, WALL_H, 2, -(GOAL_W / 2 + sideBackW / 2), WALL_H / 2, zPos, 0, 0, 0, 0x162238, glow, 0.4);
      addStaticBox(sideBackW, WALL_H, 2, (GOAL_W / 2 + sideBackW / 2), WALL_H / 2, zPos, 0, 0, 0, 0x162238, glow, 0.4);
