<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Car Soccer Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #ui {
      position: absolute; top: 20px; width: 100%; text-align: center;
      color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
  </style>
  <!-- Load Three.js and Cannon.js for 3D graphics and physics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="ui">BLUE: <span id="score">0</span></div>

  <script>
    // --- 1. SETUP THREE.JS SCENE & CANNON PHYSICS WORLD ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 3. ARENA & STADIUM ---
    // Physical Ground
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // Visual Field
    const fieldMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 100),
      new THREE.MeshStandardMaterial({ color: 0x2e8b57 })
    );
    fieldMesh.rotation.x = -Math.PI / 2;
    fieldMesh.receiveShadow = true;
    scene.add(fieldMesh);

    // --- 4. THE BALL ---
    const ballRadius = 2;
    const ballBody = new CANNON.Body({
      mass: 1,
      shape: new CANNON.Sphere(ballRadius),
      position: new CANNON.Vec3(0, 5, 0)
    });
    world.addBody(ballBody);

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(ballRadius, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xff4500 })
    );
    ballMesh.castShadow = true;
    scene.add(ballMesh);

    // --- 5. THE CAR ---
    const carSize = { x: 2, y: 1, z: 4 };
    const carBody = new CANNON.Body({
      mass: 5,
      shape: new CANNON.Box(new CANNON.Vec3(carSize.x / 2, carSize.y / 2, carSize.z / 2)),
      position: new CANNON.Vec3(0, 1, 35)
    });
    world.addBody(carBody);

    const carMesh = new THREE.Mesh(
      new THREE.BoxGeometry(carSize.x, carSize.y, carSize.z),
      new THREE.MeshStandardMaterial({ color: 0x0088ff })
    );
    carMesh.castShadow = true;
    scene.add(carMesh);

    // --- 6. CONTROLS & MOVEMENT ---
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function handleInput() {
      const speed = 15;
      const turnSpeed = 2.0;

      // Forward / Backward
      if (keys['w'] || keys['ArrowUp']) {
        carBody.velocity.x = -Math.sin(carBody.quaternion.y) * speed;
        carBody.velocity.z = -Math.cos(carBody.quaternion.y) * speed;
      }
      if (keys['s'] || keys['ArrowDown']) {
        carBody.velocity.x = Math.sin(carBody.quaternion.y) * (speed / 2);
        carBody.velocity.z = Math.cos(carBody.quaternion.y) * (speed / 2);
      }

      // Steering
      if (keys['a'] || keys['ArrowLeft']) carBody.angularVelocity.y = turnSpeed;
      else if (keys['d'] || keys['ArrowRight']) carBody.angularVelocity.y = -turnSpeed;
      else carBody.angularVelocity.y = 0;
    }

    // --- 7. GAME LOOP ---
    let score = 0;

    function animate() {
      requestAnimationFrame(animate);

      // Step Physics
      world.step(1 / 60);

      // Sync Visuals with Physics
      handleInput();
      carMesh.position.copy(carBody.position);
      carMesh.quaternion.copy(carBody.quaternion);

      ballMesh.position.copy(ballBody.position);
      ballMesh.quaternion.copy(ballBody.quaternion);

      // Smooth Camera Chase
      camera.position.x = carBody.position.x;
      camera.position.y = carBody.position.y + 6;
      camera.position.z = carBody.position.z + 12;
      camera.lookAt(carBody.position);

      // Check Goal Scored (Ball crosses z < -50)
      if (ballBody.position.z < -50) {
        score++;
        document.getElementById('score').innerText = score;
        ballBody.position.set(0, 5, 0);
        ballBody.velocity.set(0, 0, 0);
        ballBody.angularVelocity.set(0, 0, 0);
      }

      renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
