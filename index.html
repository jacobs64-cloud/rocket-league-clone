<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Soccer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #scoreboard {
      display: flex;
      gap: 40px;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 10px;
      background: #1e1e1e;
      padding: 10px 30px;
      border-radius: 12px;
      border: 2px solid #333;
    }
    .p1-score { color: #3b82f6; }
    .p2-score { color: #ef4444; }
    canvas {
      background-color: #2e7d32;
      border: 4px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    #controls {
      margin-top: 12px;
      display: flex;
      gap: 40px;
      font-size: 0.9rem;
      color: #aaa;
    }
    span.key {
      background: #333;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div id="scoreboard">
    <div class="p1-score">BLUE: <span id="score1">0</span></div>
    <div id="status">FIRST TO 5</div>
    <div class="p2-score">RED: <span id="score2">0</span></div>
  </div>

  <canvas id="gameCanvas" width="900" height="500"></canvas>

  <div id="controls">
    <div><strong>Blue Car:</strong> <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> + <span class="key">Space</span> (Boost)</div>
    <div><strong>Red Car:</strong> <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span> + <span class="key">Shift</span> (Boost)</div>
    <div><span class="key">R</span> Reset Match</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');
    const statusEl = document.getElementById('status');

    const GOAL_WIDTH = 140;
    const GOAL_TOP = (canvas.height - GOAL_WIDTH) / 2;
    const GOAL_BOTTOM = GOAL_TOP + GOAL_WIDTH;
    const WIN_SCORE = 5;

    let score1 = 0;
    let score2 = 0;
    let gameOver = false;
    let goalMessageTimer = 0;

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyR') resetMatch();
    });
    window.addEventListener('keyup', (e) => (keys[e.code] = false));

    class Car {
      constructor(x, y, angle, color, controls) {
        this.startX = x;
        this.startY = y;
        this.startAngle = angle;
        this.color = color;
        this.controls = controls;
        this.width = 40;
        this.height = 24;
        this.radius = 18;
        this.reset();
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.angle = this.startAngle;
        this.speed = 0;
        this.vx = 0;
        this.vy = 0;
        this.boost = 100;
      }

      update() {
        const isBoosting = keys[this.controls.boost] && this.boost > 0;
        const accel = isBoosting ? 0.45 : 0.25;
        const maxSpeed = isBoosting ? 8.5 : 5.5;

        if (isBoosting) {
          this.boost = Math.max(0, this.boost - 1.2);
        } else {
          this.boost = Math.min(100, this.boost + 0.3);
        }

        if (keys[this.controls.up]) this.speed += accel;
        if (keys[this.controls.down]) this.speed -= accel * 0.7;

        // Friction
        this.speed *= 0.95;
        if (this.speed > maxSpeed) this.speed = maxSpeed;
        if (this.speed < -maxSpeed * 0.6) this.speed = -maxSpeed * 0.6;

        // Turning (only when moving)
        if (Math.abs(this.speed) > 0.2) {
          const turnDir = this.speed >= 0 ? 1 : -1;
          if (keys[this.controls.left]) this.angle -= 0.065 * turnDir;
          if (keys[this.controls.right]) this.angle += 0.065 * turnDir;
        }

        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;

        this.x += this.vx;
        this.y += this.vy;

        // Arena boundaries
        if (this.x < this.radius) { this.x = this.radius; this.speed *= -0.5; }
        if (this.x > canvas.width - this.radius) { this.x = canvas.width - this.radius; this.speed *= -0.5; }
        if (this.y < this.radius) { this.y = this.radius; this.speed *= -0.5; }
        if (this.y > canvas.height - this.radius) { this.y = canvas.height - this.radius; this.speed *= -0.5; }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Boost flame
        if (keys[this.controls.boost] && this.boost > 0) {
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(-this.width / 2, -6);
          ctx.lineTo(-this.width / 2 - 14 - Math.random() * 8, 0);
          ctx.lineTo(-this.width / 2, 6);
          ctx.fill();
        }

        // Car body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-this.width / 2, -this.height / 2, this.width, this.height, 5);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#111';
        ctx.stroke();

        // Windshield
        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(4, -this.height / 2 + 4, 10, this.height - 8);

        ctx.restore();

        // Boost bar under car
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(this.x - 20, this.y + 22, 40, 4);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(this.x - 20, this.y + 22, (this.boost / 100) * 40, 4);
      }
    }

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 0,
      vy: 0,
      radius: 22,
      reset() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.vx = 0;
        this.vy = 0;
      },
      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Air resistance
        this.vx *= 0.985;
        this.vy *= 0.985;

        // Top & bottom wall bounce
        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy *= -0.8;
        }
        if (this.y + this.radius > canvas.height) {
          this.y = canvas.height - this.radius;
          this.vy *= -0.8;
        }

        // Left & right walls (excluding goals)
        const inGoalY = this.y > GOAL_TOP && this.y < GOAL_BOTTOM;

        if (!inGoalY) {
          if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -0.8;
          }
          if (this.x + this.radius > canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx *= -0.8;
          }
        } else {
          // Check Goal Scored
          if (this.x + this.radius < 0) {
            handleGoal(2);
          } else if (this.x - this.radius > canvas.width) {
            handleGoal(1);
          }
        }
      },
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#222';
        ctx.stroke();

        // Soccer pentagon pattern
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    };

    const car1 = new Car(150, canvas.height / 2, 0, '#3b82f6', {
      up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', boost: 'Space'
    });

    const car2 = new Car(canvas.width - 150, canvas.height / 2, Math.PI, '#ef4444', {
      up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', boost: 'ShiftRight'
    });

    function checkCarBallCollision(car) {
      const dx = ball.x - car.x;
      const dy = ball.y - car.y;
      const dist = Math.hypot(dx, dy);
      const minDist = car.radius + ball.radius;

      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;

        // Separate ball from car
        const overlap = minDist - dist;
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        // Transfer momentum
        const impactForce = Math.hypot(car.vx, car.vy) * 1.4 + 2.5;
        ball.vx = nx * impactForce + car.vx * 0.4;
        ball.vy = ny * impactForce + car.vy * 0.4;
      }
    }

    function checkCarCarCollision() {
      const dx = car2.x - car1.x;
      const dy = car2.y - car1.y;
      const dist = Math.hypot(dx, dy);
      const minDist = car1.radius + car2.radius;

      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = (minDist - dist) / 2;

        car1.x -= nx * overlap;
        car1.y -= ny * overlap;
        car2.x += nx * overlap;
        car2.y += ny * overlap;

        car1.speed *= 0.6;
        car2.speed *= 0.6;
      }
    }

    function handleGoal(scoringPlayer) {
      if (gameOver) return;

      if (scoringPlayer === 1) {
        score1++;
        score1El.textContent = score1;
        statusEl.textContent = 'BLUE SCORES!';
      } else {
        score2++;
        score2El.textContent = score2;
        statusEl.textContent = 'RED SCORES!';
      }

      if (score1 >= WIN_SCORE || score2 >= WIN_SCORE) {
        gameOver = true;
        statusEl.textContent = score1 >= WIN_SCORE ? 'BLUE WINS! (Press R)' : 'RED WINS! (Press R)';
      } else {
        goalMessageTimer = 90;
        resetPositions();
      }
    }

    function resetPositions() {
      car1.reset();
      car2.reset();
      ball.reset();
