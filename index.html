<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rocket League Clone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111622;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #hud {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .blue { color: #38bdf8; }
    .orange { color: #fb923c; }
    canvas {
      background: #1e293b;
      border: 3px solid #475569;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    #controls {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="blue">BLUE: <span id="blueScore">0</span></div>
    <div>BOOST: <span id="boostVal">100</span></div>
    <div class="orange">ORANGE: <span id="orangeScore">0</span></div>
  </div>
  <canvas id="game" width="960" height="580"></canvas>
  <div id="controls">
    WASD / Arrows: Drive & Steer | Shift: Boost | Space: Jump / Flip | R: Reset Ball
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const blueScoreEl = document.getElementById("blueScore");
    const orangeScoreEl = document.getElementById("orangeScore");
    const boostValEl = document.getElementById("boostVal");

    const W = canvas.width;
    const H = canvas.height;
    const GOAL_W = 24;
    const GOAL_H = 160;
    const GOAL_TOP = (H - GOAL_H) / 2;
    const GOAL_BOT = (H + GOAL_H) / 2;

    let blueScore = 0;
    let orangeScore = 0;
    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Space") {
        e.preventDefault();
        triggerJumpOrFlip();
      }
      if (e.code === "KeyR") {
        resetPositions();
      }
    });
    window.addEventListener("keyup", (e) => (keys[e.code] = false));

    const car = {
      x: 220,
      y: H / 2,
      vx: 0,
      vy: 0,
      angle: 0,
      radius: 20,
      boost: 100,
      z: 0,
      vz: 0,
      flipTimer: 0,
      flipAngle: 0
    };

    const ball = {
      x: W / 2,
      y: H / 2,
      vx: 0,
      vy: 0,
      radius: 22
    };

    const pads = [
      { x: 160, y: 110, active: true, timer: 0 },
      { x: 160, y: H - 110, active: true, timer: 0 },
      { x: W / 2, y: 90, active: true, timer: 0 },
      { x: W / 2, y: H - 90, active: true, timer: 0 },
      { x: W - 160, y: 110, active: true, timer: 0 },
      { x: W - 160, y: H - 110, active: true, timer: 0 }
    ];

    function triggerJumpOrFlip() {
      if (car.z <= 0.1) {
        car.vz = 5.5;
      } else if (car.flipTimer <= 0) {
        car.flipTimer = 0.35;
        car.vx += Math.cos(car.angle) * 5.5;
        car.vy += Math.sin(car.angle) * 5.5;
      }
    }

    function resetPositions() {
      car.x = 220;
      car.y = H / 2;
      car.vx = 0;
      car.vy = 0;
      car.angle = 0;
      car.z = 0;
      car.vz = 0;
      car.boost = 100;

      ball.x = W / 2;
      ball.y = H / 2;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 2.5;
      ball.vy = (Math.random() - 0.5) * 4;
    }

    function update(dt) {
      const up = keys["KeyW"] || keys["ArrowUp"];
      const down = keys["KeyS"] || keys["ArrowDown"];
      const left = keys["KeyA"] || keys["ArrowLeft"];
      const right = keys["KeyD"] || keys["ArrowRight"];
      const boosting = (keys["ShiftLeft"] || keys["ShiftRight"]) && car.boost > 0;

      const speedFactor = Math.hypot(car.vx, car.vy) > 0.4 ? 1 : 0.65;
      const turnRate = 3.6 * speedFactor;
      if (left) car.angle -= turnRate * dt;
      if (right) car.angle += turnRate * dt;

      let accel = 0;
      if (up) accel += 420;
      if (down) accel -= 320;
      if (boosting) {
        accel += 520;
        car.boost = Math.max(0, car.boost - 38 * dt);
      }

      car.vx += Math.cos(car.angle) * accel * dt;
      car.vy += Math.sin(car.angle) * accel * dt;

      // Air / jump physics
      if (car.z > 0 || car.vz > 0) {
        car.z += car.vz * 45 * dt;
        car.vz -= 16 * dt;
        if (car.z <= 0) {
          car.z = 0;
          car.vz = 0;
        }
      }
      if (car.flipTimer > 0) {
        car.flipTimer -= dt;
        car.flipAngle += 18 * dt;
      } else {
        car.flipAngle = 0;
      }

      // Drag
      const drag = car.z > 0 ? 0.992 : 0.965;
      car.vx *= Math.pow(drag, dt * 60);
      car.vy *= Math.pow(drag, dt * 60);

      car.x += car.vx * dt * 60;
      car.y += car.vy * dt * 60;

      // Arena walls for car
      if (car.x - car.radius < 0) { car.x = car.radius; car.vx *= -0.4; }
      if (car.x + car.radius > W) { car.x = W - car.radius; car.vx *= -0.4; }
      if (car.y - car.radius < 0) { car.y = car.radius; car.vy *= -0.4; }
      if (car.y + car.radius > H) { car.y = H - car.radius; car.vy *= -0.4; }

      // Boost pads
      for (const pad of pads) {
        if (!pad.active) {
          pad.timer -= dt;
          if (pad.timer <= 0) pad.active = true;
        } else if (Math.hypot(car.x - pad.x, car.y - pad.y) < car.radius + 12) {
          car.boost = Math.min(100, car.boost + 35);
          pad.active = false;
          pad.timer = 5;
        }
      }

      // Ball movement
      ball.vx *= Math.pow(0.99, dt * 60);
      ball.vy *= Math.pow(0.99, dt * 60);
      ball.x += ball.vx * dt * 60;
      ball.y += ball.vy * dt * 60;

      // Top & bottom walls
      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.vy = -ball.vy * 0.85;
      }
      if (ball.y + ball.radius > H) {
        ball.y = H - ball.radius;
        ball.vy = -ball.vy * 0.85;
      }

      // Left & right walls + goals
      const inGoalY = ball.y > GOAL_TOP && ball.y < GOAL_BOT;
      if (ball.x - ball.radius < 0) {
        if (inGoalY && ball.x < -GOAL_W * 0.4) {
          orangeScore++;
          orangeScoreEl.textContent = orangeScore;
          resetPositions();
          return;
        } else if (!inGoalY) {
          ball.x = ball.radius;
          ball.vx = -ball.vx * 0.85;
        }
      }
      if (ball.x + ball.radius > W) {
        if (inGoalY && ball.x > W + GOAL_W * 0.4) {
          blueScore++;
          blueScoreEl.textContent = blueScore;
          resetPositions();
          return;
        } else if (!inGoalY) {
          ball.x = W - ball.radius;
          ball.vx = -ball.vx * 0.85;
        }
      }

      // Car-to-ball collision
      const dx = ball.x - car.x;
      const dy = ball.y - car.y;
      const dist = Math.hypot(dx, dy);
      const minDist = car.radius + ball.radius;
      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        ball.x += nx * overlap * 0.75;
        ball.y += ny * overlap * 0.75;
        car.x -= nx * overlap * 0.25;
        car.y -= ny * overlap * 0.25;

        const relVx = car.vx - ball.vx;
        const relVy = car.vy - ball.vy;
        const impact = Math.max(4, (relVx * nx + relVy * ny) * 1.25 + (boosting ? 3.5 : 1));
        ball.vx = nx * impact + car.vx * 0.3;
        ball.vy = ny * impact + car.vy * 0.3;
      }

      boostValEl.textContent = Math.round(car.boost);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Pitch markings
      ctx.strokeStyle = "rgba(255,255,255,0.14)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 75, 0, Math.PI * 2);
      ctx.stroke();

      // Goals
      ctx.fillStyle = "rgba(56, 189, 248, 0.22)";
      ctx.fillRect(0, GOAL_TOP, GOAL_W, GOAL_H);
      ctx.strokeStyle = "#38bdf8";
      ctx.strokeRect(0, GOAL_TOP, GOAL_W, GOAL_H);

      ctx.fillStyle = "rgba(251, 146, 60, 0.22)";
      ctx.fillRect(W - GOAL_W, GOAL_TOP, GOAL_W, GOAL_H);
      ctx.strokeStyle = "#fb923c";
      ctx.strokeRect(W - GOAL_W, GOAL_TOP, GOAL_W, GOAL_H);

      // Boost pads
      for (const pad of pads) {
        ctx.beginPath();
        ctx.arc(pad.x, pad.y, 11, 0, Math.PI * 2);
        ctx.fillStyle = pad.active ? "#facc15" : "rgba(250, 204, 21, 0.15)";
        ctx.fill();
      }

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#0f172a";
      ctx.stroke();

      // Car shadow & body (scaled slightly by height z)
      const scale = 1 + car.z * 0.015;
      ctx.save();
      ctx.translate(car.x, car.y - car.z * 0.5);
      ctx.rotate(car.angle);
      ctx.scale(scale, scale);

      if ((keys["ShiftLeft"] || keys["ShiftRight"]) && car.boost > 0) {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(-20, -7);
        ctx.lineTo(-34 - Math.random() * 10, 0);
        ctx.lineTo(-20, 7);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(-18, -11, 36, 22);
      ctx.fillStyle = "#e0f2fe";
      ctx.fillRect(-4, -8, 12, 16);

      // Nose indicator
      ctx.fillStyle = "#0284c7";
      ctx.fillRect(14, -10, 5, 20);
      ctx.restore();
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    resetPositions();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
