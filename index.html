<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Car Soccer Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #ui {
      position: absolute; top: 20px; width: 100%; text-align: center;
      color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="ui">BLUE: <span id="score">0</span></div>

  <script>
    // --- 1. SCENE & PHYSICS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    // --- 2. LIGHTING ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(25, 45, 25);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 3. FIELD & WALLS ---
    const fieldW = 60;
    const fieldL = 100;

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    const fieldMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(fieldW, fieldL),
      new THREE.MeshStandardMaterial({ color: 0x2e8b57 })
    );
    fieldMesh.rotation.x = -Math.PI / 2;
    fieldMesh.receiveShadow = true;
    scene.add(fieldMesh);

    function addWall(x, y, z, w, h, d, color = 0xffffff, opacity = 0.25) {
      const body = new CANNON.Body({
        mass: 0,
        shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)),
        position: new CANNON.Vec3(x, y, z)
      });
      world.addBody(body);

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, transparent: true, opacity })
      );
      mesh.position.set(x, y, z);
      scene.add(mesh);
    }

    // Left, right, back, and front walls
    addWall(-fieldW / 2, 3, 0, 1, 6, fieldL);
    addWall(fieldW / 2, 3, 0, 1, 6, fieldL);
    addWall(0, 3, fieldL / 2, fieldW, 6, 1);
    addWall(0, 3, -fieldL / 2, fieldW, 6, 1, 0xffd700, 0.35);

    // --- 4. BALL ---
    const ballRadius = 2.2;
    const ballBody = new CANNON.Body({
      mass: 1,
      shape: new CANNON.Sphere(ballRadius),
      position: new CANNON.Vec3(0, 4, 0),
      linearDamping: 0.15
    });
    world.addBody(ballBody);

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(ballRadius, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xff4500 })
    );
    ballMesh.castShadow = true;
    scene.add(ballMesh);

    // --- 5. CAR ---
    const carSize = { x: 2.2, y: 1.1, z: 4.2 };
    const carBody = new CANNON.Body({
      mass: 6,
      shape: new CANNON.Box(new CANNON.Vec3(carSize.x / 2, carSize.y / 2, carSize.z / 2)),
      position: new CANNON.Vec3(0, 1.2, 32),
      linearDamping: 0.35,
      angularDamping: 0.5
    });
    world.addBody(carBody);

    const carMesh = new THREE.Mesh(
      new THREE.BoxGeometry(carSize.x, carSize.y, carSize.z),
      new THREE.MeshStandardMaterial({ color: 0x0088ff })
    );
    carMesh.castShadow = true;
    scene.add(carMesh);

    // --- 6. CONTROLS ---
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    const threeQuat = new THREE.Quaternion();

    function getCarYaw() {
      threeQuat.set(carBody.quaternion.x, carBody.quaternion.y, carBody.quaternion.z, carBody.quaternion.w);
      euler.setFromQuaternion(threeQuat);
      return euler.y;
    }

    function handleInput() {
      const speed = 18;
      const turnSpeed = 2.4;
      const yaw = getCarYaw();

      // Forward points along -Z when yaw = 0
      const forwardX = -Math.sin(yaw);
      const forwardZ = -Math.cos(yaw);

      if (keys['w'] || keys['arrowup']) {
        carBody.velocity.x = forwardX * speed;
        carBody.velocity.z = forwardZ * speed;
      } else if (keys['s'] || keys['arrowdown']) {
        carBody.velocity.x = -forwardX * (speed * 0.6);
        carBody.velocity.z = -forwardZ * (speed * 0.6);
      }

      if (keys['a'] || keys['arrowleft']) {
        carBody.angularVelocity.set(0, turnSpeed, 0);
      } else if (keys['d'] || keys['arrowright']) {
        carBody.angularVelocity.set(0, -turnSpeed, 0);
      } else {
        carBody.angularVelocity.set(0, 0, 0);
      }
    }

    // --- 7. GAME LOOP ---
    let score = 0;

    function animate() {
      requestAnimationFrame(animate);

      world.step(1 / 60);
      handleInput();

      carMesh.position.copy(carBody.position);
      carMesh.quaternion.copy(carBody.quaternion);

      ballMesh.position.copy(ballBody.position);
      ballMesh.quaternion.copy(ballBody.quaternion);

      // Chase camera behind the car
      const yaw = getCarYaw();
      const camDist = 13;
      const camHeight = 6.5;
      camera.position.set(
        carBody.position.x + Math.sin(yaw) * camDist,
        carBody.position.y + camHeight,
        carBody.position.z + Math.cos(yaw) * camDist
      );
      camera.lookAt(carBody.position.x, carBody.position.y + 1.5, carBody.position.z);

      // Score when ball hits the far gold wall (z < -46)
      if (ballBody.position.z < -46) {
        score++;
        document.getElementById('score').innerText = score;
        ballBody.position.set(0, 4, 0);
        ballBody.velocity.set(0, 0, 0);
        ballBody.angularVelocity.set(0, 0, 0);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
