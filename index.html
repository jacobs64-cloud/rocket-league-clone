<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Turbo Arena — Physics Prototype</title>
  <style>
    html,body{margin:0;overflow:hidden;background:#07101d;color:white;font:14px Arial}
    #ui{position:fixed;z-index:2;top:12px;left:50%;
      transform:translateX(-50%);padding:10px 16px;
      background:#000b;border-radius:10px;text-align:center}
    #error{color:#ff7777}
  </style>
</head>
<body>
  <div id="ui">
    <b>PLAYER PHYSICS TEST</b><br>
    W/S drive · A/D steer · R reset<br>
    <span id="speed">Speed: 0</span>
    <div id="error"></div>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import RAPIER from
      "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm";

    const errorBox = document.querySelector("#error");

    try {
      await RAPIER.init();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x07101d);
      scene.fog = new THREE.Fog(0x07101d, 35, 100);

      const camera = new THREE.PerspectiveCamera(
        65, innerWidth / innerHeight, 0.1, 200
      );

      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xbad6ff, 0x182030, 2));

      const sunlight = new THREE.DirectionalLight(0xffffff, 3);
      sunlight.position.set(15, 30, 10);
      sunlight.castShadow = true;
      scene.add(sunlight);

      const physics = new RAPIER.World({x:0, y:-18, z:0});
      const dynamicHandles = [];

      function material(color, emissive=0x000000) {
        return new THREE.MeshStandardMaterial({
          color,
          roughness:.55,
          metalness:.2,
          emissive,
          emissiveIntensity: emissive ? 1.5 : 0
        });
      }

      function boxMesh(size, position, color) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(...size),
          material(color)
        );
        mesh.position.set(...position);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      }

      function staticBox(size, position, color=0x24364c) {
        const body = physics.createRigidBody(
          RAPIER.RigidBodyDesc.fixed()
        .setTranslation(position[0], position[1], position[2])
        );

        physics.createCollider(
          RAPIER.ColliderDesc.cuboid(
            size[0]/2, size[1]/2, size[2]/2
          ),
          body
        );

        boxMesh(size, position, color);
      }

      // Simple test arena
      staticBox([40, 1, 70], [0, -0.5, 0], 0x17283b);
      staticBox([40, 8, 1], [0, 4, -35]);
      staticBox([40, 8, 1], [0, 4, 35]);
      staticBox([1, 8, 70], [-20, 4, 0]);
      staticBox([1, 8, 70], [20, 4, 0]);

      // Player rigid body
      const playerBody = physics.createRigidBody(
        RAPIER.RigidBodyDesc.dynamic()
          .setTranslation(0, 2, 18)
          .setRotation({x:0, y:0, z:0, w:1})
          .setLinearDamping(0.55)
          .setAngularDamping(2.5)
          .setCanSleep(false)
      );

      physics.createCollider(
        RAPIER.ColliderDesc.cuboid(1.2, 0.45, 2)
          .setMass(100)
          .setFriction(1.4)
          .setRestitution(0.05),
        playerBody
      );

      const car = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, .8, 4),
        material(0x0878ff)
      );
      body.position.y = .7;
      body.castShadow = true;
      car.add(body);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.55, .6, 1.7),
        new THREE.MeshStandardMaterial({
          color:0x122238,
          roughness:.15,
          metalness:.35,
          transparent:true,
          opacity:.9
        })
      );
      cabin.position.set(0, 1.25, -.25);
      cabin.castShadow = true;
      car.add(cabin);

      scene.add(car);

      const keys = {};
      addEventListener("keydown", event => {
        keys[event.code] = true;
        if (event.code === "KeyR") reset();
      });
      addEventListener("keyup", event => {
        keys[event.code] = false;
      });

      function reset() {
        playerBody.setTranslation({x:0, y:2, z:18}, true);
        playerBody.setLinvel({x:0, y:0, z:0}, true);
        playerBody.setAngvel({x:0, y:0, z:0}, true);
        playerBody.setRotation({x:0, y:0, z:0, w:1}, true);
      }

      function drive(dt) {
        const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
        const steer = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);

        const rotation = playerBody.rotation();

        // Forward direction derived from the rigid body's orientation.
        const forwardX = -(1 - 2 * (rotation.y * rotation.y +
                                    rotation.z * rotation.z));
        const forwardZ = -(2 * (rotation.x * rotation.z -
                                rotation.w * rotation.y));

        const velocity = playerBody.linvel();
        const horizontalSpeed =
          Math.hypot(velocity.x, velocity.z);

        const acceleration = 900;
        const force = forward * acceleration * dt;

        playerBody.applyImpulse({
          x: forwardX * force,
          y: 0,
          z: forwardZ * force
        }, true);

        // Basic yaw control, limited to avoid unstable spinning.
        if (horizontalSpeed > 0.4 || Math.abs(forward) > 0) {
          playerBody.applyTorqueImpulse({
            x:0,
            y: -steer * 2.5 * dt,
            z:0
          }, true);
        }

        // Clamp horizontal test speed.
        const maxSpeed = 22;
        const currentSpeed = Math.hypot(velocity.x, velocity.z);

        if (currentSpeed > maxSpeed) {
          const scale = maxSpeed / currentSpeed;
          playerBody.setLinvel({
            x: velocity.x * scale,
            y: velocity.y,
            z: velocity.z * scale
          }, true);
        }
      }

      let previous = performance.now();

      function frame(now) {
        const dt = Math.min((now - previous) / 1000, 1/30);
        previous = now;

        drive(dt);
        physics.step();

        const position = playerBody.translation();
        const rotation = playerBody.rotation();

        car.position.set(position.x, position.y, position.z);
        car.quaternion.set(rotation.x, rotation.y, rotation.z, rotation.w);

        const velocity = playerBody.linvel();
        document.querySelector("#speed").textContent =
          `Speed: ${Math.round(Math.hypot(velocity.x, velocity.z) * 3.6)} km/h`;

        const cameraTarget = new THREE.Vector3(
          position.x, position.y + 1, position.z
        );

        const cameraPosition = new THREE.Vector3(
          position.x, position.y + 7, position.z + 11
        );

        camera.position.lerp(cameraPosition, 0.1);
        camera.lookAt(cameraTarget);

        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      reset();
      requestAnimationFrame(frame);

    } catch (error) {
      console.error(error);
      errorBox.textContent =
        "Physics initialization failed. Open DevTools for details.";
    }
  </script>
</body>
</html>
